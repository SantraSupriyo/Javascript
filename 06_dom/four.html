<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Chai aur Code</title>
</head>
<body style="background-color: #212121; color: white;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    // *********  NOT OPTIMIZED **********
    function addLanguage(langName) {
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage("Python")
    addLanguage("JAVA")

    // ************ OPTIMIZED *********

    function addOptLang(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector(".language").appendChild(li)
    }
    addOptLang("TypeScript")

    // Edit

    const seclang = document.querySelector("li:nth-child(2)")
    // seclang.innerHTML = "mojo"
    const newLi = document.createElement("li")
    newLi.textContent = "Mojo"
    seclang.replaceWith(newLi)

    // Edit
    const firsrlang = document.querySelector("li:first-child")
    firsrlang.outerHTML = '<li>Typescript</li>'

    //  remove
    const lastlang = document.querySelector("li:last-child")
    lastlang.remove()
</script>
</html>
